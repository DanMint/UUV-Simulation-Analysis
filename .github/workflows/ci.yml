name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: cmake -B windows_build/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake windows_build

      - name: Build
        run: cmake --build windows_build/build --config Release --target uuv_sim test_attackerAgent test_simulation test_diveld_scenario

      - name: Run tests
        run: ctest --test-dir windows_build/build --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows_build/build/Release/*.exe
